name: Build ESP32-C5 Router Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware (ESP32-C5 Wi-Fi 6)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.4
        target: esp32c5
        path: esp32c5-pro-router

    - name: Upload Built Binaries
      uses: actions/upload-artifact@v4
      with:
        name: esp32c5-router-binaries
        path: |
          esp32c5-pro-router/build/esp32c5-pro-router.bin
          esp32c5-pro-router/build/bootloader/bootloader.bin
          esp32c5-pro-router/build/partition_table/partition-table.bin
          esp32c5-pro-router/build/ota_data_initial.bin

